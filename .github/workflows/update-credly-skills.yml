name: Update Credly Skills

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *" # daily at 03:30 UTC

concurrency:
  group: update-credly-skills
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-credly-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Update README skills section
        run: node scripts/update_credly_skills.mjs

      - name: Commit and push changes (if any)
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update Credly skills"
          git push
