name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (workflows + markdown)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows (actionlint)
        uses: rhysd/actionlint@v1.7.12

      - name: Lint Markdown (README)
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            README.md
